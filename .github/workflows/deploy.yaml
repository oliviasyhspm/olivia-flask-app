name: Build, Push & Deploy to ECS

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: olivia-flask-private-repository   # change to your repo name
  ECS_CLUSTER: olivia-flask-ecs-cluster             # change to your ECS cluster name
  ECS_SERVICE: olivia-flask-service                 # change to your ECS service name
  ECS_TASKDEF: olivia-flask-ecs-taskdef             # change to your ECS task definition family name
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image
      run: |
        docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
        docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Render new task definition
      id: taskdef
      run: |
        IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
        echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
        # Replace container image in task definition JSON
        aws ecs describe-task-definition --task-definition $ECS_TASKDEF \
          --query taskDefinition > taskdef.json
        cat taskdef.json | jq '.containerDefinitions[0].image = env.IMAGE_URI' > new-taskdef.json

    - name: Register new task definition
      run: |
        aws ecs register-task-definition --cli-input-json file://new-taskdef.json

    - name: Update ECS service
      run: |
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --force-new-deployment
